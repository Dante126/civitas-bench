# All eight departments are played by Arcee's trinity-large-thinking.
# 120 months x 8 roles = ~960 calls per episode: expect many hours. Use --set game.act_every=3
# (~320 calls) or configs/smoke.toml first.
name = "arcee_full"

[game]
months = 120
act_every = 1
max_actions_per_turn = 8

[scoring]
target_population = 30000

[providers.arcee]
base_url = "https://api.arcee.ai/api/v1"
api_key_env = "ARCEE_API_KEY"
timeout = 300    # give up (and retry) after this long with no streamed data

[agents.mayor]
kind = "llm"
provider = "arcee"
model = "trinity-large-thinking"
temperature = 0.4
max_tokens = 32000    # room for long reasoning; the client streams, so long turns are fine

[agents.planning]
kind = "llm"
provider = "arcee"
model = "trinity-large-thinking"

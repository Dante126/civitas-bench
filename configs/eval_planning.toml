# Role-isolated evaluation: only Planning is an LLM, the other roles are the
# scripted baselines. Differences in score are then attributable to Planning.
# Swap the model from the CLI:  --agent planning=llm:arcee/trinity-mini
name = "eval_planning"

[game]
months = 120

[agents.mayor]
kind = "scripted"

[agents.planning]
kind = "llm"
provider = "arcee"
model = "trinity-large-thinking"
max_tokens = 24000    # prompt + output must stay under ~32k: at 32000 the Arcee API hangs instead of answering

[agents.utilities]
kind = "scripted"

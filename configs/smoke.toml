# Quick LLM check: 2 years, agents act every 3 months (~24 calls).
# Mayor, Planning and Utilities on the LLM; the other departments are scripted.
name = "smoke"

[game]
months = 24
act_every = 3

[providers.arcee]
timeout = 300    # a full 24k-token turn takes ~75 s

[agents.mayor]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 24000    # prompt + output must stay under ~32k: at 32000 the Arcee API hangs instead of answering

[agents.planning]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 24000    # prompt + output must stay under ~32k: at 32000 the Arcee API hangs instead of answering

[agents.utilities]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 24000    # prompt + output must stay under ~32k: at 32000 the Arcee API hangs instead of answering

# Quick LLM check: 2 years, agents act every 3 months (~24 calls).
# Mayor, Planning and Utilities on the LLM; the other departments are scripted.
name = "smoke"

[game]
months = 24
act_every = 3

[providers.arcee]
timeout = 300    # give up (and retry) after this long with no streamed data

[agents.mayor]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # room for long reasoning; the client streams, so long turns are fine

[agents.planning]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # room for long reasoning; the client streams, so long turns are fine

[agents.utilities]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # room for long reasoning; the client streams, so long turns are fine

# Quick LLM check: 2 years, agents act every 3 months (~24 calls).
# Mayor, Planning and Utilities on the LLM; the other departments are scripted.
name = "smoke"

[game]
months = 24
act_every = 3

[providers.arcee]
timeout = 600

[agents.mayor]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # Arcee key is uncapped; 12k cut off long reasoning turns

[agents.planning]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # Arcee key is uncapped; 12k cut off long reasoning turns

[agents.utilities]
kind = "llm"
model = "trinity-large-thinking"
max_tokens = 32000    # Arcee key is uncapped; 12k cut off long reasoning turns
